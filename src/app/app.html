<div style="padding: 30px; font-family: Arial, sans-serif;">
  <h2>{{ title }}</h2>
  <p>Datos obtenidos en tiempo real desde .NET Core y SQL Express.</p>

  <table border="1" cellpadding="10" cellspacing="0" style="width: 100%; border-collapse: collapse; margin-top: 20px;">
    <thead style="background-color: #f2f2f2;">
      <tr>
        <th align="left">Nombre Completo</th>
        <th align="left">Teléfono</th>
      </tr>
    </thead>
    <tbody>
      @for (persona of personas; track $index) {
      <tr>
        <td>{{ persona.nombre }}</td>
        <td>{{ persona.telefono }}</td>
      </tr>
      } @empty {
      <tr>
        <td colspan="2" align="center" style="color: gray;">
          No hay registros cargados o la API está apagada.
        </td>
      </tr>
      }
    </tbody>
  </table>
</div>
